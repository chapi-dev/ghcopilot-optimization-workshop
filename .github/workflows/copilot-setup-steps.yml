# Environment setup steps for the GitHub Copilot cloud coding agent.
#
# The cloud coding agent runs this workflow to prepare its container BEFORE it starts working.
# It must be named exactly `copilot-setup-steps.yml` and live in `.github/workflows/`.
# The job MUST be named `copilot-setup-steps`.
#
# Docs: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-environment
#
# This repo has no build; the setup just installs the tooling used by the docs/challenges
# (Markdown linting and the markitdown token-saver). Adjust for your own repos.

name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or the agent will ignore it.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node (for markdownlint)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Set up Python (for markitdown token-saver)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install markitdown
        run: pip install "markitdown[all]"
